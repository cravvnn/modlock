syntax = "proto3";

package modlock.peernet;

option go_package = "github.com/paralin/modlock/peernet;peernet";

import "github.com/paralin/modlock/src/host_app/control/control.proto";
import "github.com/paralin/modlock/src/wasm/ui/ui.proto";

// PeerNet is the service a modlock daemon serves for its peer: the PC's
// identity on the peer network and the links it can open to other PCs.
service PeerNet {
  // GetPeer returns the daemon's peer and its admission to signaling.
  rpc GetPeer(GetPeerRequest) returns (GetPeerResponse);

  // Probe opens a stream to another peer and measures its round trip.
  rpc Probe(ProbeRequest) returns (ProbeResponse);

  // Host serves the local game server to guests holding the join code it
  // sends first, for as long as the call stays open. The caller sends the
  // server first, then the server's players and interfaces.
  rpc Host(stream HostInput) returns (stream HostEvent);

  // Join links to a hosted game server and serves it to the local game on a
  // loopback port until the game leaves or the call ends.
  rpc Join(JoinRequest) returns (stream JoinEvent);
}

// Session is the service a hosting PC's daemon serves to its guests' daemons
// over their peer link, on SessionProtocolID.
service Session {
  // Watch streams what the guest sees: what the mods show them, the whole
  // screen first and then only what changed, and each chat line said from
  // the call on.
  rpc Watch(WatchRequest) returns (stream SessionEvent);
}

// AdmissionState is where a peer stands with the signaling service, which
// introduces it to peers it cannot reach on its own network.
enum AdmissionState {
  // ADMISSION_STATE_SIGNED_OUT means no sign-in is saved, so the service
  // does not know the peer.
  ADMISSION_STATE_SIGNED_OUT = 0;
  // ADMISSION_STATE_CONNECTING means the peer is opening its admission
  // socket, or waits to retry after it dropped.
  ADMISSION_STATE_CONNECTING = 1;
  // ADMISSION_STATE_ADMITTED means the service signals for the peer.
  ADMISSION_STATE_ADMITTED = 2;
  // ADMISSION_STATE_REFUSED means the service refused the saved sign-in,
  // which has expired or was signed out.
  ADMISSION_STATE_REFUSED = 3;
}

// GetPeerRequest asks for the daemon's peer.
message GetPeerRequest {}

// GetPeerResponse describes the daemon's peer.
message GetPeerResponse {
  // peer_id is the PC's peer on the network.
  string peer_id = 1;
  // origin is the signaling service, such as https://hyperline.gg.
  string origin = 2;
  // admission is the peer's standing with that service.
  AdmissionState admission = 3;
  // account is the signed-in name, when a sign-in is saved.
  string account = 4;
  // error says why the last admission attempt failed while connecting.
  string error = 5;
}

// ProbeRequest names the peer to measure.
message ProbeRequest {
  // peer_id is the other PC's peer.
  string peer_id = 1;
}

// ProbeResponse reports one measured link.
message ProbeResponse {
  // rtt_us is the shortest round trip of the probe's packets, in
  // microseconds.
  uint32 rtt_us = 1;
  // relayed reports that the link runs through the service's relay rather
  // than directly between the PCs.
  bool relayed = 2;
}

// RelayCredentials answers GET /api/turn-credentials, which issues
// short-lived relay credentials to a signed-in creator.
message RelayCredentials {
  // servers are the relay servers the peer may use.
  repeated RelayServer servers = 1;
  // expires_at is when the credentials stop working, in Unix milliseconds.
  int64 expires_at = 2;
}

// RelayServer is one relay and its credential.
message RelayServer {
  // urls are the server's STUN and TURN addresses.
  repeated string urls = 1;
  // username is the credential's identifier.
  string username = 2;
  // credential is the credential's secret.
  string credential = 3;
}

// HostInput is one message of a Host call.
message HostInput {
  oneof body {
    // start names the server, and comes first.
    HostRequest start = 1;
    // server is a change to the server's players or interfaces: a join, a
    // leave or an interface change. The first ones after start bring the
    // daemon to the server's state.
    modlock.host_app.control.HostEvent server = 2;
  }
}

// HostRequest names the game server to serve.
message HostRequest {
  // port is the server's UDP game port on loopback.
  uint32 port = 1;
}

// HostEvent is one change to a hosted session.
message HostEvent {
  oneof body {
    // join_code is the code a guest passes to modlock join. It names the
    // host's peer and the session, and comes first.
    string join_code = 1;
    // joined is the peer of a guest whose game stream the host accepted.
    string joined = 2;
    // left is the peer of a guest whose game stream ended.
    string left = 3;
  }
}

// JoinRequest names the session to join.
message JoinRequest {
  // code is the host's join code.
  string code = 1;
  // steam_id is the guest's Steam ID, whose screen the guest is sent; zero
  // sends no screen.
  fixed64 steam_id = 2;
}

// JoinEvent is one step of joining a hosted session.
message JoinEvent {
  oneof body {
    // address is the loopback endpoint the local game connects to, sent once
    // the host accepted the guest.
    string address = 1;
    // arrived reports the game's first packet through address.
    bool arrived = 2;
    // screen changes what the mods show the guest. A reset frame carries
    // the whole screen.
    ScreenFrame screen = 3;
    // chat is a line a player said in the game.
    modlock.host_app.control.PlayerChat chat = 4;
  }
}

// WatchRequest names the guest whose session to stream.
message WatchRequest {
  // session is the join code's secret.
  fixed64 session = 1;
  // steam_id is the guest's Steam ID.
  fixed64 steam_id = 2;
}

// ScreenFrame is one change to a player's screen.
message ScreenFrame {
  // changes holds each changed mod's change to its tree, by mod name.
  map<string, modlock.wasm.ui.Change> changes = 1;
  // reset starts the screen over before the changes, as the first frame of
  // each watch does.
  bool reset = 2;
}

// SessionEvent is one thing a guest sees in a hosted session.
message SessionEvent {
  oneof body {
    // screen changes what the mods show the guest.
    ScreenFrame screen = 1;
    // chat is a line a player said in the game.
    modlock.host_app.control.PlayerChat chat = 2;
  }
}
